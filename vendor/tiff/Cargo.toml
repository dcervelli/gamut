[package]
edition = "2021"
rust-version = "1.85.0"
name = "tiff"
version = "0.11.3"
authors = ["The image-rs Developers"]
build = false
exclude = [
    "tests/images/*",
    "tests/fuzz_images/*",
    "tests/**/*.tif",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "TIFF decoding and encoding library in pure Rust"
categories = [
    "multimedia::images",
    "multimedia::encoding",
]
license = "MIT"
repository = "https://github.com/image-rs/image-tiff"
resolver = "2"

[features]
default = [
    "deflate",
    "fax",
    "jpeg",
    "lzw",
]
deflate = ["dep:flate2"]
fax = ["dep:fax34"]
jpeg = ["dep:zune-jpeg"]
lzw = ["dep:weezl"]
webp = ["dep:image-webp"]
zstd = ["dep:zstd"]

[lib]
name = "tiff"
path = "src/lib.rs"

[dependencies.fax34]
version = "0.2.6"
optional = true
package = "fax"

[dependencies.flate2]
version = "1.0.20"
optional = true

[dependencies.half]
version = "2.4.1"

[dependencies.image-webp]
version = "0.2.4"
optional = true

[dependencies.quick-error]
version = "2.0.1"

[dependencies.weezl]
version = "0.2.1"
optional = true

[dependencies.zstd]
version = "0.13"
optional = true

[dependencies.zune-jpeg]
version = "0.5.1"
optional = true

