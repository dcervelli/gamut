version = 1

# What in this tree is under what license, in the form `reuse lint` can check.
#
# gamut itself is `MIT OR Apache-2.0`, and the blanket rule below says so once
# rather than in a header at the top of every file. The rules after it are the
# exceptions: files that carry someone else's work as well as gamut's own. The
# last matching rule wins, so the exceptions come after the blanket.
#
# `precedence = "override"` makes this file authoritative over anything the
# tool might otherwise read out of a source file. Without it `reuse` treats a
# stray use of the word "Copyright" in a comment — a decoder quoting a format
# specification, say — as a copyright notice of its own.
#
# The license texts these names refer to are in `LICENSES/`, named by their
# SPDX identifier. `LICENSE-MIT` and `LICENSE-APACHE` stay at the root: they
# are gamut's own license, which is what a reader and GitHub both look there
# for.
#
# `LICENSES/` holds every license anything in the distribution is under, not
# only what the source tree carries, because `THIRD-PARTY-NOTICES` is in the
# tree too and is annotated below for what it actually is. That is the
# stronger invariant to keep and the one `reuse lint` can check.

[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Dan Cervelli"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The icons. `src/ui/icon.rs` redescribes Lucide's geometry as a table of
# marks on Lucide's own 24-unit grid; the module's own docs say why it is a
# table rather than the path data Lucide ships.
[[annotations]]
path = "src/ui/icon.rs"
precedence = "override"
SPDX-FileCopyrightText = [
    "2013-2022 Cole Bemis",
    "2022 Lucide Contributors",
    "2026 Dan Cervelli",
]
SPDX-License-Identifier = "ISC AND (MIT OR Apache-2.0)"

# The colormaps, which are polynomial fits rather than sampled tables, and so
# carry the license of the fit rather than of the colormap it approximates.
# Viridis and magma are Matt Zucker's fits to matplotlib's (CC0, and the data
# fitted was CC0 too); turbo is Google's own fit to theirs (Apache-2.0). The
# same coefficients appear twice because the shader and its CPU twin have to
# agree — see the note above `viridis()` in the shader.
[[annotations]]
path = ["src/image/display.rs", "src/render/shaders/image.wgsl"]
precedence = "override"
SPDX-FileCopyrightText = [
    "2019 Matt Zucker",
    "2019 Google LLC",
    "2026 Dan Cervelli",
]
SPDX-License-Identifier = "CC0-1.0 AND Apache-2.0 AND (MIT OR Apache-2.0)"

# The notices of the crates linked into the binary, generated from Cargo.lock
# by `bin/release` — see `about.toml` for what it is allowed to find. It is
# not gamut's work and the blanket rule above must not claim it: what it
# contains is the license of each crate it lists, reproduced in full, so it is
# annotated with the set of those licenses and their authors are named inside
# it crate by crate. Adding a dependency under a license new to this list
# means a text for it in `LICENSES/` as well; `about.toml`'s `accepted` list
# is what stops one arriving unnoticed.
[[annotations]]
path = "THIRD-PARTY-NOTICES"
precedence = "override"
SPDX-FileCopyrightText = "the authors of the crates listed in the file"
SPDX-License-Identifier = "MIT AND Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND ISC AND Zlib AND Unicode-3.0"
