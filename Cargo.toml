[package]
name = "image-view"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
glyphon = "0.12.0"
half = { version = "2.7.1", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["exr", "hdr", "jpeg", "png", "tiff"] }
# `v1_20` rather than the crate's default `latest`: it is the oldest `libheif`
# whose security limits this build can all raise, and pinning to the newest
# would refuse to compile against a perfectly capable older release.
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_20"] }
moxcms = "0.8.1"
# Header parsing only: `image` decodes the pixels but surfaces nothing of a
# PNG's `cICP` chunk, which is the whole of how a PNG says it is HDR. Already
# in the tree as `image`'s own decoder, so this costs no new dependency.
png = "0.18.1"
pollster = "1.0.1"
tiff = "0.11.3"
# The container half of Ultra HDR: finds the gain map through MPF and XMP and
# hands back raw JPEG bytes, leaving the decoding to whatever codec we already
# have. `ultrahdr-core`, which does the gain map arithmetic, comes with it.
ultrahdr-rs = "0.3.5"
wgpu = "30.0.1"
winit = "0.30.13"
