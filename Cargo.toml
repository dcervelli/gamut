[package]
name = "gamut"
version = "0.2.0"
edition = "2024"
# The floor egui sets: every crate of its family declares 1.95, and nothing
# here is older than what they ask for. Nothing is pinned by this — Arch
# tracks current Rust — but clippy checks the code against it, so it stays
# honest.
rust-version = "1.95"
description = "A GPU image viewer with real color management, for photographs, measurement data and HDR"
repository = "https://github.com/dcervelli/gamut"
homepage = "https://github.com/dcervelli/gamut"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["image", "viewer", "hdr", "color-management", "wgpu"]
categories = ["graphics", "multimedia::images", "command-line-utilities"]

[profile.release]
lto = true
codegen-units = 1
strip = true
# `panic` stays at its default of "unwind". The loader turns a decoder panic on
# a malformed file into a recoverable error, and it does that with
# `catch_unwind` (`loader.rs`, and `cli.rs` while probing); aborting instead
# would take the whole window down every time a broken image was opened.

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
# The interface: an immediate-mode toolkit whose widgets are drawn into the
# same sRGB target the compositor lays over the picture, so it never has to
# know what an HDR surface is. Its one default feature is a bundle of fonts
# under licenses `about.toml` does not accept, and the interface is set in the
# desktop's own faces anyway — see `ui/fonts.rs` — so it is left off.
egui = { version = "0.36.2", default-features = false }
# The half that draws with wgpu. Its defaults are for wgpu's own feature set
# and a macOS fix, neither of which this tree needs beyond what `wgpu` below
# already turns on; its `winit` feature would take over the surface, whose
# format `render/output.rs` chooses on purpose.
egui-wgpu = { version = "0.36.2", default-features = false }
# And the half that turns winit's events into egui's. Its clipboard feature
# would bring a second clipboard library beside `wl-clipboard-rs`, and
# `links` a browser launcher: both off, the two backends on.
egui-winit = { version = "0.36.2", default-features = false, features = ["wayland", "x11"] }
# Asks fontconfig which faces the desktop is set in, so that the interface
# is set in the same ones — see `ui/fonts.rs`. The library is opened at run
# time rather than linked, so the build needs no headers and a desktop
# without it still gets a window; `fontdb` below is what answers then.
fontconfig = { version = "0.11", features = ["dlopen"] }
# The fallback: reads the font directories itself and resolves the generic
# families from fontconfig's aliases alone, which is a rougher answer than
# the library's but needs nothing installed.
fontdb = "0.23"
# Reads a face's vertical metrics, so that its capitals can be centered in
# the rows egui lays out. It is the reader egui's own text layout uses, so
# the numbers are the ones the rows are built from.
skrifa = "0.44"
half = { version = "2.7.1", features = ["bytemuck"] }
# `ico` is enabled for the DIB half of an ICO only: the hooks that decode a
# headerless bitmap and apply its AND mask are `pub(crate)` behind that
# feature, so `IcoDecoder` is the only way to reach them. Which entry to show,
# and what a PNG entry means, are decided in `decode::ico`. `ico` implies
# `bmp`, which `decode::image_rs` now reads in its own right; it is named here
# anyway, so that dropping `ico` could not quietly take `.bmp` with it.
image = { version = "0.25.10", default-features = false, features = ["bmp", "exr", "gif", "hdr", "ico", "jpeg", "png", "pnm", "tiff"] }
# The GIF container, read directly for the two things `image` does not say
# about an animation: how many frames it holds, which the header does not
# state and which is counted here without decoding a frame, and whether the
# loop extension is there at all — `image` reports a file that says nothing as
# looping for ever, where browsers play it once. Already linked as `image`'s
# own GIF decoder, so this costs no new dependency.
gif = "0.14.2"
# WebP, direct rather than through `image`'s `webp` feature: the ICC profile,
# the EXIF orientation and the animation canvas all live in the RIFF container
# beside the pixels, and `ImageReader` hands back only the pixels.
image-webp = "0.2.4"
# JPEG XL, pure Rust: no shared library for the package to depend on and no C
# toolchain for the build, which is what sets this apart from the HEIF path.
# It renders into the color encoding the file itself declares and hands the
# numbers over untouched, which is the bargain every decoder here is written
# to, so what it says about a file can be passed straight on.
#
# `rayon` is its only default feature and is kept, at the cost of five crates:
# JPEG XL is expensive to decode, and a 12-megapixel photograph costs about
# 450 ms on one thread against about 220 ms on many — the difference between
# stepping through a directory and waiting on it. The optional integrations
# are all left off. `lcms2` in particular would link a second color library
# beside `moxcms`, and neither is wanted: color transformation is this
# program's own job, and asking the decoder to convert would be exactly the
# normalizing the model is built to avoid.
jxl-oxide = { version = "0.12.6", default-features = false, features = ["rayon"] }
# The EXIF block, for the info panel: the metadata a photograph carries about
# how it was taken, which no decoder here surfaces and which lives in a
# different place in every container. This reads it out of JPEG, TIFF, PNG,
# WebP and HEIF alike, and renders a field's units, fractions and enumerated
# values — a table that would otherwise have to be carried here. Pure Rust,
# and careful with the files it is given: a chunk is read with `take`, so a
# length claimed by a broken file allocates only what the file actually holds.
kamadak-exif = "0.6.1"
# `v1_23` to match the security-limits struct of the libheif this links
# against. `SecurityLimits::new()` copies the C library's global limits, which
# carry that library's own `version` field (4 for libheif 1.23); a binding
# older than the library then hands that version-4 struct back to
# `heif_context_set_security_limits`, which reads the version-3/4 fields from
# past the end of the shorter Rust struct — an out-of-bounds read across FFI.
# The binding must therefore be at least as new as the library: an older
# library than the binding fails cleanly at build time via `system-deps`,
# which is the safe direction to err in.
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_23"] }
moxcms = "0.8.1"
# Header parsing only: `image` decodes the pixels but surfaces nothing of a
# PNG's `cICP` chunk, which is the whole of how a PNG says it is HDR. Already
# in the tree as `image`'s own decoder, so this costs no new dependency.
png = "0.18.1"
pollster = "1.0.1"
tiff = "0.11.3"
# The container half of Ultra HDR: finds the gain map through MPF and XMP and
# hands back raw JPEG bytes, leaving the decoding to whatever codec we already
# have. `ultrahdr-core`, which does the gain map arithmetic, comes with it.
ultrahdr-rs = "0.3.5"
wgpu = "30.0.1"
winit = "0.30.13"
# The compositor's word on which monitors are in HDR mode, read through the
# color-management protocol on a connection of our own. A driver offers an
# HDR color space for a window on any monitor; only the compositor knows
# what the monitor is doing, and asking for the space on one in SDR mode can
# make it switch the monitor over, blanking every display on the way. Both
# crates are already in the tree under winit; `staging` is where the protocol
# lives.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
# The clipboard, which Wayland leaves to the client: there is no store to put
# a string in, only a promise to hand the bytes over when someone later asks.
# This speaks that protocol directly rather than shelling out to `wl-copy`,
# which would be a runtime dependency on a package the user may not have.
wl-clipboard-rs = "0.9.3"

[dev-dependencies]
# Drives the interface without a window, through the accessibility tree egui
# builds of it: a test clicks a button by its name and asks what came of it.
egui_kittest = "0.36.2"
# The tests set the interface in egui's own fonts rather than the desktop's,
# so that they run the same on a machine with no fontconfig to ask. A
# feature of a dev-dependency reaches only the test builds, and `about.toml`
# leaves those out, so the bundle's licenses are never shipped.
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
