[package]
name = "image-view"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
glyphon = "0.12.0"
half = { version = "2.7.1", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["exr", "hdr", "jpeg", "png", "tiff"] }
pollster = "1.0.1"
tiff = "0.11.3"
wgpu = "30.0.1"
winit = "0.30.13"
