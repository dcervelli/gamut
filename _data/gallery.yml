# Sidebar entries for the index page, in display order. The first item is shown
# when the URL has no #id.
#   id:    URL fragment (#id) that selects the item
#   kind:  image | video | demo | doc
#   src:   media path under site.media_url (image, video); ignored while
#          _config.yml has placeholder_media: true
#   thumb: file in assets/thumbs/ (see make-thumbs.sh); omit for a text tile
#   text:  Markdown shown beside or below the media. Write it as a `|` block
#          so blank lines survive as paragraph breaks (`>` folds them away):
#            text: |
#              First paragraph, wrapped
#              across lines.
#
#              Second paragraph.
#   file:  Markdown file in _includes/gallery/ used in place of text, for long
#          entries. Liquid runs first, so images can use {{ site.media_url }}.
# Titles are placeholders taken from the file names; text is lorem ipsum.
lorem: &lorem |
  Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor
  incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis
  nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.

  Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu
  fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in
  culpa qui officia deserunt mollit anim id est laborum.

groups:
