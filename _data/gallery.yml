# Sidebar entries for the index page, in display order. The first item is shown
# when the URL has no #id.
#   id:    URL fragment (#id) that selects the item
#   kind:  image | video | doc
#   src:   media path under site.media_url (image, video)
#   thumb: media path under site.media_url, like src (screenshots/x_thumb.jpg);
#          a bare file name is taken from assets/thumbs/ (see make-thumbs.sh)
#          instead. Omit for a text tile
#   icon:  name of an SVG in assets/icons/ (doc for doc.svg) drawn on the tile
#          when there is no thumb
#   text:  Markdown shown beside or below the media. Write it as a `|` block
#          so blank lines survive as paragraph breaks (`>` folds them away):
#            text: |
#              First paragraph, wrapped
#              across lines.
#
#              Second paragraph.
#   file:  Markdown file in _includes/gallery/ used in place of text, for long
#          entries. Liquid runs first, so images can use {{ site.media_url }}.
#   cycle: seconds per step of a slideshow driven by the text's #id links. The
#          first link's step shows this item's own src; each later one
#          highlights its link and shows the linked item's poster (its thumb)
#          with a link through to it. Hovering a link takes over from the timer
#          until the links have been left alone for 15 seconds.

